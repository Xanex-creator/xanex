<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XANEX Links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Montserrat:wght@500;700&display=swap">
<style>
/* Layout: one centered white card on a blue gradient, avatar overlapping the card's top edge, stacked pill buttons. */
:root {
  --bg-top: #010a14;
  --bg-bottom: #0a7fa8;
  --card: #ffffff;
  --ink: #0b1020;
  --muted: #3a4256;
  --btn-dark: #141824;
  --btn-dark-ink: #ffffff;
  --accent: #0a7fb0;
  --accent-ink: #ffffff;
  --halo: rgba(20, 30, 70, 0.14);
  --font-display: "Unbounded", "Montserrat", "Segoe UI Symbol", "Noto Sans Math", system-ui, sans-serif;
  --font-body: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { background: var(--bg-top); }
body {
  min-height: 100dvh;
  background: linear-gradient(180deg, var(--bg-top) 0%, #04283d 45%, var(--bg-bottom) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; padding-top: 56px; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.card {
  position: relative;
  background: var(--card);
  border-radius: 28px;
  padding: 72px 16px 28px;
  box-shadow: 0 24px 60px rgba(0, 8, 40, 0.45);
}
.avatar {
  position: absolute;
  top: -56px;
  left: 50%;
  transform: translateX(-50%);
  width: 112px;
  height: 112px;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid var(--card);
  background: radial-gradient(circle at 30% 25%, #3d82ff, #0c2a80 70%);
  display: grid;
  place-items: center;
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 44px;
  box-shadow: 0 8px 24px rgba(0, 20, 90, 0.35);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
h1 {
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 8vw, 36px);
  letter-spacing: 0.04em;
  text-wrap: balance;
}
.lead {
  margin: 10px auto 20px;
  max-width: 30ch;
  text-align: center;
  font-weight: 700;
  font-size: 15px;
  line-height: 1.45;
  color: var(--muted);
  text-wrap: balance;
}
.links { display: flex; flex-direction: column; gap: 10px; }
.link {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 58px;
  padding: 10px 16px;
  border-radius: 999px;
  text-decoration: none;
  background: var(--btn-dark);
  color: var(--btn-dark-ink);
  box-shadow: 0 0 0 7px var(--halo);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.link:hover { transform: translateY(-2px); filter: brightness(1.12); }
.link:active { transform: translateY(0); }
.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.link.primary { background: var(--accent); color: var(--accent-ink); }
.link svg { flex: none; width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.label { flex: 1; min-width: 0; text-align: center; padding-right: 36px; line-height: 1.2; }
.label small { display: block; margin-top: 3px; font-family: var(--font-body); font-weight: 700; font-size: 12px; letter-spacing: 0; text-transform: none; opacity: 0.85; }
@media (prefers-reduced-motion: reduce) { .link { transition: none; } }
@media (max-width: 480px) {
  body { padding-block: 16px 28px; }
  .wrap { padding-top: 66px; }
  .card { padding: 78px 14px 24px; border-radius: 26px; }
  .avatar { width: 128px; height: 128px; top: -66px; font-size: 50px; }
  .lead { font-size: 16px; margin-bottom: 22px; }
  .link { min-height: 66px; font-size: 14px; padding: 10px 14px; }
  .link svg { width: 26px; height: 26px; }
  .label { padding-right: 38px; }
}
</style>

<script>
(function () {
  var c = document.getElementById('bg'), x = c.getContext('2d');
  var W, H, dpr, t = 0, dots = [];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var blobs = [
    { r: 0.60, s: 0.00022, p: 0, c: '30,190,240' },
    { r: 0.55, s: 0.00029, p: 2.1, c: '10,120,200' },
    { r: 0.50, s: 0.00019, p: 4.2, c: '90,220,255' }
  ];
  function mk(any) {
    return { x: Math.random() * W, y: any ? Math.random() * H : H + 20, r: 1 + Math.random() * 3.5,
      v: 0.15 + Math.random() * 0.45, a: Math.random() * 6.28, w: 0.4 + Math.random() * 1.2, o: 0.15 + Math.random() * 0.45 };
  }
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(W * H / 14000);
    dots = [];
    for (var i = 0; i < n; i++) dots.push(mk(true));
    if (reduce) frame();
  }
  function frame() {
    var bg = x.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#010a14');
    bg.addColorStop(0.45, '#04283d');
    bg.addColorStop(1, '#0a7fa8');
    x.globalCompositeOperation = 'source-over';
    x.fillStyle = bg;
    x.fillRect(0, 0, W, H);
    var m = Math.max(W, H);
    x.globalCompositeOperation = 'lighter';
    blobs.forEach(function (b) {
      var px = W * (0.5 + 0.42 * Math.sin(t * b.s + b.p));
      var py = H * (0.5 + 0.42 * Math.cos(t * b.s * 1.3 + b.p));
      var g = x.createRadialGradient(px, py, 0, px, py, b.r * m);
      g.addColorStop(0, 'rgba(' + b.c + ',0.38)');
      g.addColorStop(1, 'rgba(' + b.c + ',0)');
      x.fillStyle = g;
      x.fillRect(0, 0, W, H);
    });
    x.globalCompositeOperation = 'source-over';
    dots.forEach(function (d, i) {
      if (!reduce) {
        d.y -= d.v;
        d.x += Math.sin(d.a + t * 0.001 * d.w) * 0.35;
        if (d.y < -20) dots[i] = mk(false);
      }
      x.beginPath();
      x.arc(d.x, d.y, d.r, 0, 6.2832);
      x.fillStyle = 'rgba(180,240,255,' + d.o + ')';
      x.fill();
    });
  }
  function loop(ts) { t = ts; frame(); requestAnimationFrame(loop); }
  window.addEventListener('resize', function () {
    /* phone address bar showing or hiding only changes the height a little: keep the bubbles where they are */
    if (window.innerWidth === W && Math.abs(window.innerHeight - H) < 160) {
      H = window.innerHeight;
      c.height = H * dpr;
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (reduce) frame();
    } else {
      size();
    }
  });
  size();
